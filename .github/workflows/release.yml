# Išleidimas: pažymėk versiją (git tag v0.7.1 && git push --tags) - GitHub pats paleidžia testus,
# subuildina abu zip ir sukuria Release. Žmonių programos jį pamato per kelias valandas (arba „Check now“).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install "PySide6-Essentials==6.12.0" numpy pyyaml pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "from lth_timing import VERSION; print(VERSION)")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "lth_timing VERSION is $V but the tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build Windows package
        run: python packaging/build_dist.py
      - name: Release notes
        run: |
          V=$(python -c "from lth_timing import VERSION; print(VERSION)")
          python - <<'PY' > notes.md
          import re
          v = open("lth_timing/__init__.py").read().split('VERSION = "')[1].split('"')[0]
          txt = open("packaging/README.txt", encoding="utf-8").read()
          m = re.search(r"New in " + re.escape(v) + r"\n-+\n(.*?)(?:\nNew in |\Z)", txt, re.S)
          print(m.group(1).strip() if m else f"LTH Overlays {v}")
          print()
          print("runtime: " + open("dist/runtime.txt").read().strip())
          PY
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: LTH Overlays ${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/LTH-Overlays-${{ env.VERSION }}-win64.zip
            dist/LTH-Overlays-${{ env.VERSION }}-update.zip
            dist/LTH-Overlays-${{ env.VERSION }}-update.zip.sha256
